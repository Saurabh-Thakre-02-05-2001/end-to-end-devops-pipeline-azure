spring.application.name=shopkart
server.port=8099
# Configuring view components
spring.mvc.view.prefix=/view/
spring.mvc.view.suffix=.jsp

# --- H2 (local development) ---
# Console: http://localhost:8099/h2-console  JDBC URL: jdbc:h2:mem:shopkart  User: sa  (no password)
spring.datasource.url=jdbc:h2:mem:shopkart;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate creates schema first; then classpath:data.sql runs (seed users, admin, products)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# H2 dialect is auto-detected; set spring.jpa.database-platform only for MySQL etc.
spring.jpa.properties.hibernate.show_sql=true

# For MySQL instead: set spring.datasource.* to your JDBC URL, user, password, use
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect and spring.jpa.hibernate.ddl-auto=update,
# and consider spring.sql.init.mode=never if you manage data yourself.

# Upload root: directory that will contain the "uploads" folder (override with env PROJECT_PATH)
spring.servlet.multipart.enabled=true
file.project-path=${PROJECT_PATH:./}
file.image-path=uploads
